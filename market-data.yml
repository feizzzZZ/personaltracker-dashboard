name: Update market data

# ทำงาน 2 รอบ/วัน — 06:30 และ 18:30 เวลาไทย
# FRED อัปเดตดึกตามเวลา US, Yahoo ปิดตลาดราว 04:00 ไทย → 06:30 ได้ของสดของวัน
# รอบเย็นไว้อัปเดต SET + ค่าเงินหลังตลาดไทยปิด
on:
  schedule:
    - cron: '30 23 * * *'   # 06:30 ไทย (UTC+7)
    - cron: '30 11 * * *'   # 18:30 ไทย
  workflow_dispatch:         # ปุ่ม "Run workflow" กดเองได้ทันทีจากหน้า Actions

permissions:
  contents: write            # ต้องมี ไม่งั้น push กลับเข้า repo ไม่ได้

concurrency:
  group: market-data
  cancel-in-progress: false  # อย่ายกเลิกรอบที่กำลังเขียนไฟล์อยู่ — เสี่ยง commit ครึ่งๆ

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # สคริปต์ใช้ stdlib ล้วน — ไม่มี pip install ให้พังตอน CI
      # continue-on-error: ให้ commit ขั้นถัดไปยังรันด้วยข้อมูลที่ merge เก็บค่าเดิมไว้แล้ว
      # แต่ยัง fail job รวมได้ตอนท้าย (step ถัดไป) เพื่อไม่ให้ CI เขียวทั้งที่ fetch พังหนัก
      - name: Fetch market data
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_market_data.py

      - name: Show summary
        run: |
          python3 - <<'PY'
          import json
          j = json.load(open('market-data.json'))
          s = j.get('stats', {})
          print(f"keys รอบนี้ : {s.get('keys_this_run')}")
          print(f"keys รวม    : {s.get('keys_total')}")
          print(f"sectors     : {s.get('sectors')}")
          for w in s.get('warnings', []):
              print(f"  ⚠️  {w}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add market-data.json
          # เทียบข้อมูลจริงโดยตัด generated_at/fetched_at ออกก่อน — timestamp เปลี่ยน
          # ทุกรันแม้ข้อมูลจริงจะเหมือนเดิม ทำให้ git diff --quiet เดิมไม่เคยว่างเลย
          OLD_HASH=$(git show HEAD:market-data.json 2>/dev/null | jq -S 'del(.generated_at) | .data |= with_entries(.value |= del(.fetched_at))' | sha256sum | cut -d' ' -f1 || true)
          NEW_HASH=$(jq -S 'del(.generated_at) | .data |= with_entries(.value |= del(.fetched_at))' market-data.json | sha256sum | cut -d' ' -f1)
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "ข้อมูลจริงไม่เปลี่ยน (ต่างแค่ timestamp) — ข้าม commit"
          else
            git commit -m "chore(data): market data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Fail job if fetch was degraded
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::fetch_market_data.py จบด้วย exit code ผิดปกติ — ข้อมูลที่ merge ไว้อาจถูก commit ไปแล้ว แต่ต้องตรวจ warnings ในขั้นตอน Fetch market data ด้านบน"
          exit 1
