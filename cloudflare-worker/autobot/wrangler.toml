# FinanceTracker AutoBot — Cloudflare Worker (phase 1 = paper)
# ดูขั้นตอนติดตั้งใน README.md ในโฟลเดอร์เดียวกัน
name = "financetracker-autobot"
main = "worker.js"
compatibility_date = "2024-09-23"

# ตรวจกฎทุก 15 นาที
[triggers]
crons = ["*/15 * * * *"]

# KV เก็บกฎ + พอร์ตจำลอง — สร้างด้วย: npx wrangler kv namespace create BOT แล้วเอา id มาใส่
[[kv_namespaces]]
binding = "BOT"
id = "b91251707c7943fc822f474939658f1f"

[vars]
# ที่อยู่ market-data.json ของแอปคุณบน GitHub Pages
MARKET_URL = "https://REPLACE_WITH_GITHUB_USER.github.io/personaltracker-dashboard/data/market-data.json"
# เว็บที่อนุญาตให้เรียก Worker (ต้นทางของแอป ไม่มี / ท้าย) — คั่นหลายค่าด้วย ,
ALLOWED_ORIGIN = "https://REPLACE_WITH_GITHUB_USER.github.io"
# เงินตั้งต้นของพอร์ตจำลอง (บาท)
START_THB = "100000"

# secret (ไม่อยู่ในไฟล์นี้): npx wrangler secret put BOT_TOKEN
# v78 พอร์ตสด (ไม่บังคับ · key Binance แบบอ่านอย่างเดียวเท่านั้น): npx wrangler secret put BINANCE_KEY · BINANCE_SECRET
