name: Market Data Pipeline

on:
  schedule:
    # 23:30 UTC = 06:30 เช้าไทย ทุกวัน (ก่อนตลาดไทยเปิด, หลังตลาด US ปิด)
    - cron: "30 23 * * *"
  workflow_dispatch: {}   # ปุ่ม Run workflow กดรันเองได้จากหน้า Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market data (FRED + Yahoo)
        run: python scripts/fetch_market_data.py

      - name: Commit if changed
        run: |
          git config user.name  "market-data-bot"
          git config user.email "actions@github.com"
          git add market-data.json
          git diff --staged --quiet && echo "no changes" || \
            (git commit -m "chore: market data $(date -u +%F)" && git push)
