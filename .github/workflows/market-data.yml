name: Update market data

# ทำงาน 2 รอบ/วัน — 06:30 และ 18:30 เวลาไทย
# FRED อัปเดตดึกตามเวลา US, Yahoo ปิดตลาดราว 04:00 ไทย → 06:30 ได้ของสดของวัน
# รอบเย็นไว้อัปเดต SET + ค่าเงินหลังตลาดไทยปิด
on:
  schedule:
    - cron: '30 23 * * *'   # 06:30 ไทย (UTC+7)
    - cron: '30 11 * * *'   # 18:30 ไทย
  workflow_dispatch:         # ปุ่ม "Run workflow" กดเองได้ทันทีจากหน้า Actions

permissions:
  contents: write            # ต้องมี ไม่งั้น push กลับเข้า repo ไม่ได้

concurrency:
  group: market-data
  cancel-in-progress: false  # อย่ายกเลิกรอบที่กำลังเขียนไฟล์อยู่ — เสี่ยง commit ครึ่งๆ

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # สคริปต์ใช้ stdlib ล้วน — ไม่มี pip install ให้พังตอน CI
      - name: Fetch market data
        run: python3 scripts/fetch_market_data.py

      - name: Show summary
        run: |
          python3 - <<'PY'
          import json
          j = json.load(open('market-data.json'))
          s = j.get('stats', {})
          print(f"keys รอบนี้ : {s.get('keys_this_run')}")
          print(f"keys รวม    : {s.get('keys_total')}")
          print(f"sectors     : {s.get('sectors')}")
          for w in s.get('warnings', []):
              print(f"  ⚠️  {w}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add market-data.json
          # --quiet + exit code: ไม่มีอะไรเปลี่ยน = จบสวยๆ ไม่ commit เปล่า
          if git diff --staged --quiet; then
            echo "ไม่มีอะไรเปลี่ยน — ข้าม commit"
          else
            git commit -m "chore(data): market data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
