name: Update market data

# ทำงาน 2 รอบ/วัน — 06:30 และ 18:30 เวลาไทย
# Yahoo ปิดตลาดราว 04:00 ไทย → 06:30 ได้ของสดของวัน
# รอบเย็นไว้อัปเดต SET + ค่าเงินหลังตลาดไทยปิด
on:
  schedule:
    - cron: '30 23 * * *'   # 06:30 ไทย (UTC+7)
    - cron: '30 11 * * *'   # 18:30 ไทย
  workflow_dispatch:         # ปุ่ม "Run workflow" กดเองได้ทันทีจากหน้า Actions

permissions:
  contents: write            # ต้องมี ไม่งั้น push กลับเข้า repo ไม่ได้

concurrency:
  group: market-data
  cancel-in-progress: false  # อย่ายกเลิกรอบที่กำลังเขียนไฟล์อยู่ — เสี่ยง commit ครึ่งๆ

jobs:
  update:
    runs-on: ubuntu-latest
    # เพดานรวมของ job — เป็นตาข่ายชั้นนอกเท่านั้น ไม่ใช่ตัวคุมเวลาจริง
    # ตัวคุมจริงคือ timeout-minutes ของแต่ละ step + DEADLINE ในสคริปต์
    # ต้องมากกว่าผลรวมของ step อย่างชัดเจน เผื่อเวลา checkout/setup-python/commit
    #   fetch (10m) + signals (7m) + งานประกอบ ≈ 18m  →  ตั้ง 25m
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ══════════════════════════════════════════════════════════════
      # v44 ตัด FRED ออกทั้งหมดแล้ว — step "Probe FRED endpoints" กับ
      # secret FRED_API_KEY ถูกลบทิ้งในรุ่นนี้ เหตุผล:
      #   • ไม่มีสคริปต์ไหนอ่าน FRED_API_KEY อีกแล้ว (fetch_market_data.py v44+)
      #   • probe กินเวลาได้ถึง 3 นาทีทุกรอบ เพื่อยืนยันสิ่งที่รู้อยู่แล้ว
      #     ว่า FRED บล็อก IP ของ GitHub Actions (0/14 · TimeoutError 42 ครั้ง)
      #   • log ที่ยังพูดถึง FRED ทำให้คนอ่านรอบหน้าเข้าใจผิดว่ายังใช้อยู่
      # งานสำรวจแหล่งข้อมูลย้ายไปอยู่ workflow แยก (probe-sources.yml)
      # ซึ่งรันเองเมื่อต้องการ ไม่ใช่ทุกรอบ
      # ══════════════════════════════════════════════════════════════

      # ── ขั้นที่ 1: ราคา + ดัชนี + sector ───────────────────────────
      # continue-on-error: ให้ commit ขั้นถัดไปยังรันด้วยข้อมูลที่ merge เก็บค่าเดิมไว้
      # แต่ยัง fail job รวมได้ตอนท้าย เพื่อไม่ให้ CI เขียวทั้งที่ fetch พังหนัก
      #
      # ★ ROOT CAUSE ของ run #40-47 ที่ตายทุกรอบที่ 15m18s ★
      #   เดิม timeout-minutes: 15 อยู่ที่ระดับ JOB
      #   พอชนเพดาน GitHub จะ "ยกเลิกทั้ง job" ไม่ใช่ "ทำให้ step นี้ fail"
      #   -> continue-on-error ไม่มีผล เพราะมันดักได้แค่ step ที่ exit non-zero
      #   -> step "Commit if changed" ไม่เคยได้รันเลยสักครั้ง
      #   -> market-data.json ค้างที่ 27-28 ก.ค. นาน 11 วัน
      #   ย้าย timeout มาไว้ที่ STEP: step ที่หมดเวลานับเป็น "failed"
      #   ซึ่ง continue-on-error ดักได้ -> commit step ได้รันต่อ
      #   ลำดับตัวเลขต้องเป็น: DEADLINE(8m) < step timeout(10m) < job timeout(25m)
      - name: Fetch market data
        id: fetch
        continue-on-error: true
        timeout-minutes: 10
        env:
          MARKET_DATA_DEADLINE: '480'   # 8 นาที
        run: python3 scripts/fetch_market_data.py

      # ── ขั้นที่ 2: macro + สัญญาณรายตัว + ความเสี่ยง ───────────────
      # ต้องรันหลัง fetch_market_data.py เสมอ เพราะอ่าน market-data.json
      # ที่เพิ่งเขียน (ใช้รายชื่อสินทรัพย์จาก block "prices")
      #
      # แยก step ไม่รวมกับข้างบน เพื่อให้ log บอกได้ว่าขั้นไหนพัง
      # และถ้าขั้นนี้ล้ม market-data.json ที่เขียนไปแล้วยังใช้ได้ปกติ
      # ลำดับตัวเลข: SIGNALS_DEADLINE(5m) < step timeout(7m)
      - name: Compute signals
        id: signals
        continue-on-error: true
        timeout-minutes: 7
        env:
          SIGNALS_DEADLINE: '300'       # 5 นาที
        run: python3 scripts/fetch_signals.py

      # if: always() — ต้องเห็น summary โดยเฉพาะรอบที่ fetch พัง
      # และต้องไม่ crash เองถ้าไฟล์หาย ไม่งั้นมันจะบัง Commit step ข้างล่าง
      - name: Show summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          if not os.path.exists('market-data.json'):
              print("::warning::ไม่มี market-data.json — fetch ตายก่อนเขียนไฟล์")
              raise SystemExit(0)
          j = json.load(open('market-data.json'))
          s = j.get('stats', {})
          print(f"keys รอบนี้ : {s.get('keys_this_run')}")
          print(f"keys รวม    : {s.get('keys_total')}")
          print(f"sectors     : {s.get('sectors')}")
          print(f"prices      : {s.get('prices_this_run')}/{s.get('prices_total')}")
          rt, bg = s.get('runtime_sec'), s.get('budget_sec')
          if rt is not None:
              print(f"runtime     : {rt}s / งบ {bg}s")
          # v43 — แสดงผลต่อ host เพื่อแยก "ถูกบล็อก (4xx)" ออกจาก "timeout"
          # สองอย่างนี้ต้องแก้ต่างกันคนละทาง เดิม log บอกไม่ได้
          hs = s.get('host_stats') or {}
          if hs:
              print("ผลต่อ host  :")
              for h, v in sorted(hs.items()):
                  ok = v.get('ok', 0)
                  bad = {k: n for k, n in v.items() if k != 'ok'}
                  flag = '' if ok and not bad else '  <-- มีปัญหา'
                  print(f"              {h:32s} ok={ok} {bad or ''}{flag}")
          if s.get('budget_exhausted'):
              print(f"::warning::หมดงบเวลา — ข้าม {s.get('skipped_for_budget')} request "
                    f"ไฟล์ถูกเขียนด้วยข้อมูลเท่าที่ดึงทัน + ค่าเดิมที่ merge ไว้")
          for w in s.get('warnings', []):
              print(f"  ⚠️  {w}")

          # ── สรุปขั้นสัญญาณ ──────────────────────────────────────
          m = j.get('signals_meta')
          if not m:
              print("::warning::ไม่มี block signals_meta — fetch_signals.py ไม่ได้รันหรือพังก่อนเขียนไฟล์")
          else:
              print(f"\nสัญญาณ      : {m.get('count')} ตัว · macro {len(m.get('macro_keys') or [])} keys")
              print(f"macro keys  : {', '.join(m.get('macro_keys') or []) or '(ไม่มี)'}")
              dropped = m.get('dropped_stale_fred') or []
              if dropped:
                  print(f"ลบค่าค้าง   : {', '.join(dropped)}")
              r = j.get('risk') or {}
              print(f"ความเสี่ยง  : {r.get('level')} (severity {r.get('severity')}) · "
                    f"breadth sector {r.get('breadth_sectors')}% · พอร์ต {r.get('breadth_portfolio')}%")
              for f in (r.get('flags') or []):
                  print(f"  ! {f.get('msg')}")
              for w in m.get('warnings', []):
                  print(f"  ⚠️  {w}")

          if os.path.exists('signal-history.json'):
              h = json.load(open('signal-history.json'))
              days = sorted((h.get('days') or {}).keys())
              size = os.path.getsize('signal-history.json') / 1024
              print(f"\nประวัติ     : {len(days)} วัน ({size:.0f} KB)"
                    + (f" · {days[0]} → {days[-1]}" if days else ""))
          else:
              print("::warning::ไม่มี signal-history.json — backtest จะไม่มีข้อมูลย้อนหลัง")
          PY

      # if: always() — จุดสำคัญที่สุดของไฟล์นี้
      # สคริปต์ merge ข้อมูลเดิมไว้ในไฟล์แล้วเสมอ ดังนั้นไฟล์ที่ได้จะดีกว่าหรือเท่ากับของเดิม
      # ไม่มีเหตุผลใดที่จะไม่ commit แม้รอบนั้นดึงได้ไม่ครบ
      - name: Commit if changed
        if: always()
        run: |
          if [ ! -f market-data.json ]; then
            echo "::warning::ไม่มีไฟล์ให้ commit — ข้าม"
            exit 0
          fi
          git config user.name  "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"

          # ══════════════════════════════════════════════════════════
          # signal-history.json ต้องถูก commit ด้วย — ไม่ใช่ของแถม
          # ══════════════════════════════════════════════════════════
          # runner เริ่มจาก checkout สะอาดทุกครั้ง ไฟล์ที่ไม่ได้ commit
          # จะหายไปพร้อม runner แล้วรอบหน้าสร้างใหม่ตั้งแต่ศูนย์
          # ผลคือ "ประวัติสัญญาณ" จะมีแค่วันเดียวตลอดไป และ backtest
          # จะทำไม่ได้เลย — ซึ่งเป็นเหตุผลทั้งหมดที่เก็บไฟล์นี้ตั้งแต่วันแรก
          # ใช้ if...fi แทน `[ -f f ] && git add f`
          # GitHub รัน run: ด้วย `bash -e` ซึ่งยกเว้นคำสั่งที่ไม่ใช่ตัวสุดท้าย
          # ของ AND-list ให้ (ทดสอบแล้วว่าแบบ && ไม่ทำให้ step ตายตรงนี้)
          # แต่จะตายทันทีถ้าบรรทัดนั้นบังเอิญกลายเป็นบรรทัดสุดท้ายของสคริปต์
          # เพราะ exit status ของสคริปต์จะเป็น 1 — if...fi ไม่มีกับดักนี้
          git add market-data.json
          if [ -f signal-history.json ]; then git add signal-history.json; fi

          # เทียบข้อมูลจริงโดยตัด timestamp ออกก่อน — timestamp เปลี่ยนทุกรัน
          # แม้ข้อมูลจริงจะเหมือนเดิม ทำให้ git diff --quiet ไม่เคยว่างเลย
          # ต้องตัดให้ครบทุกที่ที่มีเวลา: generated_at · data.*.fetched_at ·
          # signals_meta.generated_at · signals.*.<ไม่มีเวลา แต่ price เปลี่ยน> ·
          # risk.computed_at   (ไม่ตัด signals เพราะราคาที่เปลี่ยน = ข้อมูลจริง)
          STRIP='del(.generated_at, .signals_meta.generated_at, .risk.computed_at)
                 | .data |= with_entries(.value |= del(.fetched_at))'
          OLD_HASH=$(git show HEAD:market-data.json 2>/dev/null | jq -S "$STRIP" | sha256sum | cut -d' ' -f1 || true)
          NEW_HASH=$(jq -S "$STRIP" market-data.json | sha256sum | cut -d' ' -f1)

          # ประวัติเพิ่มวันใหม่ = ต้อง commit เสมอ แม้ราคาจะไม่ขยับเลย
          # (เช่นรอบเย็นของวันหยุดตลาด) ไม่งั้นวันนั้นจะหายจาก backtest ถาวร
          #
          # เทียบด้วย "รายชื่อวัน" ไม่ใช่ "จำนวนวัน" — พอประวัติเต็มเพดาน
          # HIST_MAX_DAYS (500) วันเก่าถูกตัดทิ้งพร้อมกับวันใหม่ที่เพิ่มเข้ามา
          # จำนวนจึงเท่าเดิมทั้งที่เนื้อหาเปลี่ยน ถ้าเทียบด้วยจำนวน วันใหม่
          # ในรอบที่ราคาไม่ขยับเลย (วันหยุดตลาด) จะหายจาก backtest ถาวร
          HIST_CHANGED=0
          if [ -f signal-history.json ]; then
            OLD_DAYS=$(git show HEAD:signal-history.json 2>/dev/null | jq -Sc '.days | keys' 2>/dev/null || echo 'none')
            NEW_DAYS=$(jq -Sc '.days | keys' signal-history.json)
            if [ "$OLD_DAYS" != "$NEW_DAYS" ]; then HIST_CHANGED=1; fi
          fi

          if [ "$OLD_HASH" = "$NEW_HASH" ] && [ "$HIST_CHANGED" = "0" ]; then
            echo "ข้อมูลจริงไม่เปลี่ยน (ต่างแค่ timestamp) — ข้าม commit"
          else
            git commit -m "chore(data): market data + signals $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # outcome รวมทั้ง 'failure' (exit≠0) และ 'cancelled' (step timeout)
      - name: Fail job if a step was degraded
        if: always() && (steps.fetch.outcome != 'success' || steps.signals.outcome != 'success')
        run: |
          echo "::error::fetch=${{ steps.fetch.outcome }} · signals=${{ steps.signals.outcome }} — ข้อมูลที่ merge ไว้อาจถูก commit ไปแล้ว แต่ต้องตรวจ warnings ในขั้นตอนด้านบน"
          exit 1
